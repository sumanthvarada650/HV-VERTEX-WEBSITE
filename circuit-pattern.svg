<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="padGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C2CB" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00C2CB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F6FFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#00C2CB" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0F6FFF" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Circuit grid lines and tracks -->
  <g stroke="url(#traceGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65">
