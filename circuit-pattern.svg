    <path d="M 160,0 L 160,60 L 200,100 L 200,180 L 150,230 L 60,230 L 30,260 L 0,260" />
    <path d="M 400,160 L 320,160 L 280,200 L 210,200 L 180,230 L 180,310 L 220,350 L 220,400" />
    <path d="M 280,0 L 280,70 L 320,110 L 380,110 L 400,130" />
    <path d="M 0,180 L 50,180 L 90,220 L 90,320 L 130,360 L 260,360 L 290,390 L 300,400" />
    <path d="M 260,140 L 290,170 L 360,170 L 390,200 L 390,290 L 340,340 L 280,340 L 250,370 L 250,400" />
    <path d="M 0,340 L 70,340 L 110,380 L 110,400" />
